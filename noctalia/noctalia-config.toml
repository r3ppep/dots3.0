[bar.default]
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "bar",
    "control-center",
    "session"
]
start = [ "launcher", "wallhaven", "workspaces", "cpu", "ram", "cat", "media" ]

[calendar]

[control_center]
width = 650

    [control_center.calendar]
    show_week_numbers = true

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 7200.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600.0

[location]
address = "Magdeburg"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2", "lockscreen-login-box@DP-3" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-3"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
layer = "overlay"
monitors = [ "DP-2", "DP-3" ]

[plugins]
enabled = [ "noctalia/bongocat", "noctalia/umbriel-companion", "noctalia/wallhaven" ]

[shell]
avatar_path = "/home/pepper/Pictures/Wallpaper/wallhaven-jerxxy.jpg"

    [shell.launcher]
    category_icons_only = true
    default_view = "all"
    pinned = [ "vivaldi-stable" ]
    width = 650

    [shell.panel]
    launcher_placement = "attached"
    session_position = "top_right"

    [shell.screenshot]
    confirm_region = true
    region_modifier = "super"

    [shell.session]
    show_shortcuts = false

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "destructive"

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "3"
        variant = "default"

[theme]
builtin = "Ayu"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "umbriel" ]
    community_ids = [ "libreoffice", "zed" ]

[wallpaper]
directory = "/home/pepper/Pictures/Wallpaper"
fill_mode = "stretch"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/pepper/Pictures/Wallpaper/wallhaven-jerxxy.jpg"

    [wallpaper.last]
    path = "/home/pepper/Pictures/Wallpaper/wallhaven-jerxxy.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/pepper/Pictures/Wallpaper/wallhaven-jerxxy.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/pepper/Pictures/Wallpaper/wallhaven-jerxxy.jpg"

[widget.bar]
type = "noctalia/umbriel-companion:bar"

[widget.cat]
type = "noctalia/bongocat:cat"

[widget.media]
album_art_only = true
art_size = 17
hide_when_idle = true
hide_when_no_media = true

[widget.network]
show_label = false

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"
