[appearance]
prefer_no_csd = true
border_width = 1               # 0-100
outer_border_width = 0        # 0-100
corner_radius = 10             # 0-100
drag_opacity = 1
opaque_fullscreen = true

[colors.border]
focused = "#c061cb"
unfocused = "#000000"
# outer = "#000000"

[appearance.blur]
enabled = true
optimized = true
passes = 5                     # 0-8
radius = 1                     # 0-100
noise = 0.02                   # 0.0-1.0
brightness = 1.0               # 0.0-2.0
contrast = 1.1                 # 0.0-2.0
saturation = 1.6

[appearance.shadow]
enabled = false
softness = 10                  # 0-200, 0 = hard edge
offset_x = 0                   # -200 to 200
offset_y = 0

[layout]
mode = "scrolling"
gap = 5
extent_presets = [0.5, 0.8, 1.0]

[layout.scrolling]
default_extent_fraction = 0.5
center_underfull_strip = true
center_focused = "never"

[layout.master]
position = "right"
default_width_fraction = 0.7
new_on_top = false

[overview]
zoom = 0.75
background_blur = true
workspace_wallpaper = false
shortcuts = true

[output.DP-2]
 mode = "2560x1440@143.980"
focus_at_startup = true
scale = 1

[output.DP-3]
 mode = "2560x1440@164.802"
scale = 1
